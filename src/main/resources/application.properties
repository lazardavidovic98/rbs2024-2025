spring.application.name=secure-bookshop

# In-memory database, recreated from schema.sql and data.sql on every start
spring.datasource.url=jdbc:h2:mem:bookshop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Session cookie must never be readable from JavaScript
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Never leak stack traces or exception messages to the client
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
