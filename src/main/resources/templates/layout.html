<!doctype html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE · Bookshop">Bookshop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"
            integrity="sha384-5AkRS45j4ukf+JbWAfHL8P4onPA9p0KwwP7pUdjSQA3ss9edbJUJc/XcYAiheSSz" crossorigin="anonymous"
            defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"
            defer></script>
    <script th:src="@{/js/csrf.js}" defer></script>
</head>
<body class="app-background">
<header>
    <nav class="navbar navbar-expand navbar-light bg-light flex-wrap">
        <a class="navbar-brand" th:href="@{/books}">Bookshop</a>
        <ul class="navbar-nav mr-auto">
            <li class="nav-item" sec:authorize="hasAuthority('VIEW_BOOK_LIST')">
                <a class="nav-link" th:href="@{/books}">Books</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('VIEW_PERSONS_LIST')">
                <a class="nav-link" th:href="@{/persons}">Users</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('NEW_VOUCHER')">
                <a class="nav-link" th:href="@{/new-voucher}">New Voucher</a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto align-items-center">
            <li class="nav-item navbar-text mr-3" sec:authorize="isAuthenticated()">
                Signed in as <strong sec:authentication="name"></strong>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('VIEW_MY_PROFILE')">
                <a class="nav-link" th:href="@{/myprofile}">My Profile</a>
            </li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="nav-link btn btn-link">Logout</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
<main class="container content-panel py-3 my-3">
    <div layout:fragment="content">
        <p>Loading...</p>
    </div>
</main>
<footer class="text-center py-3 footer-note">
    Bookshop · Secure Software Development 2024/2025
</footer>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
