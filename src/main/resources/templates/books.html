<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Books</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Books</h1>
    <div class="input-group mb-3">
        <input type="search" id="searchQuery" class="form-control" placeholder="Search by title or tag" maxlength="100"
               aria-label="Search books">
        <div class="input-group-append">
            <button class="btn btn-outline-primary" id="booksearchButton" type="button">Search</button>
        </div>
    </div>
    <p class="invisible" id="searchSummary">You searched for: <span id="searchTerm"></span></p>
    <p class="invisible text-danger" id="booksearchErrorMessage">
        Sorry, we are facing some problems! Please try again later.
    </p>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Title</th>
            <th scope="col">Author</th>
            <th scope="col">Price</th>
            <th scope="col"></th>
        </tr>
        </thead>
        <tbody id="booksTableContent">
        <tr th:each="book: ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.name}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${#numbers.formatDecimal(book.price, 1, 2)}"></td>
            <td><a th:href="@{/books(id=${book.id})}">Details</a></td>
        </tr>
        </tbody>
    </table>
    <div sec:authorize="hasAuthority('CREATE_BOOK')">
        <a class="btn btn-primary" th:href="@{/create-form}">Add Book</a>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/books.js}" defer></script>
</th:block>
</body>
</html>
