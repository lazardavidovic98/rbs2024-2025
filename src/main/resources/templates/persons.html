<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Users</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Users</h1>

    <div class="input-group mb-2">
        <input type="search" id="searchInput" class="form-control" placeholder="Search by first or last name"
               maxlength="100" aria-label="Search users">
        <div class="input-group-append">
            <button id="searchButton" class="btn btn-outline-secondary" type="button">Search</button>
        </div>
    </div>
    <p class="invisible" id="searchContainer">You searched for: <span id="searchTerm"></span></p>

    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">First Name</th>
            <th scope="col">Last Name</th>
            <th scope="col">Email</th>
            <th scope="col"></th>
        </tr>
        </thead>
        <tbody id="tableContent">
        <tr th:each="person: ${persons}">
            <td th:text="${person.id}"></td>
            <td th:text="${person.firstName}"></td>
            <td th:text="${person.lastName}"></td>
            <td th:text="${person.email}"></td>
            <td><a th:href="@{/persons/{id}(id=${person.id})}">View profile</a></td>
        </tr>
        </tbody>
    </table>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/persons.js}" defer></script>
</th:block>
</body>
</html>
