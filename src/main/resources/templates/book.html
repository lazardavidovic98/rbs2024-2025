<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Book details</title>
</head>
<body>
<div layout:fragment="content" id="book" th:data-book-id="${book.id}">
    <h1 th:text="${book.name}">Book details</h1>
    <div class="row">
        <div class="col-md-7">
            <dl>
                <dt>Author</dt>
                <dd th:text="${book.author}"></dd>
                <dt>Description</dt>
                <dd class="book-description" th:text="${book.description}"></dd>
                <dt>Price</dt>
                <dd th:text="${#numbers.formatDecimal(book.price, 1, 2)}"></dd>
                <dt>Tags</dt>
                <dd>
                    <span class="badge badge-secondary mr-1" th:each="tag: ${book.tags}" th:text="${tag.name}"></span>
                </dd>
                <dt>Rating</dt>
                <dd th:text="${averageRating != null ? averageRating : 'Not rated yet'}"></dd>
            </dl>

            <div sec:authorize="hasAuthority('RATE_BOOK')" class="mb-3">
                <p class="mb-1">My rating: <strong th:text="${userRating != null ? userRating : '-'}"></strong></p>
                <div class="form-check form-check-inline" th:each="value : ${#numbers.sequence(1, 5)}">
                    <input class="form-check-input" type="radio" name="rating" th:id="'rating' + ${value}"
                           th:value="${value}">
                    <label class="form-check-label" th:for="'rating' + ${value}" th:text="${value}"></label>
                </div>
                <button id="rateBook" type="button" class="btn btn-primary btn-sm">Rate</button>
            </div>
        </div>
    </div>

    <div class="mb-3" sec:authorize="hasAuthority('BUY_BOOK')">
        <a class="btn btn-success" th:href="@{/buy-book/{id}(id=${book.id})}">Buy book</a>
    </div>

    <h2 id="book-comments" class="h4">Comments</h2>
    <p th:if="${#lists.isEmpty(comments)}" class="text-muted">No comments yet.</p>
    <div class="form-group" th:each="comment : ${comments}">
        <strong th:text="${comment.personName}"></strong>
        <!-- th:text HTML-encodes the stored comment, so stored XSS payloads are rendered as plain text -->
        <div class="form-control comment-body" th:text="${comment.comment}"></div>
    </div>

    <div class="form-group" sec:authorize="hasAuthority('ADD_COMMENT')">
        <label for="addComment">Add comment</label>
        <textarea class="form-control" id="addComment" rows="3" maxlength="500" placeholder="Comment..."></textarea>
        <div class="text-danger small mt-1 field-error" id="commentError"></div>
        <button id="createComment" type="button" class="btn btn-primary mt-2">Create comment</button>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/book.js}" defer></script>
</th:block>
</body>
</html>
