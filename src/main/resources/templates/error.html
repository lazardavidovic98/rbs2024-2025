<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong · Bookshop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="d-flex flex-column justify-content-center align-items-center vh-100 text-center">
    <!-- Only the status code is shown: no exception messages, stack traces or SQL errors -->
    <h1 class="display-4" th:text="${status != null ? status : 'Error'}">Error</h1>
    <p class="lead" th:switch="${status}">
        <span th:case="403">You do not have permission to view this page.</span>
        <span th:case="404">The page you are looking for does not exist.</span>
        <span th:case="*">Something went wrong. Please try again later.</span>
    </p>
    <a th:href="@{/books}" class="btn btn-primary">Go home</a>
</div>
</body>
</html>
