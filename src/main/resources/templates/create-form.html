<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add book</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Add book</h1>
    <div class="alert alert-danger" th:if="${param.invalid}">
        Please fill in every field: name and author up to 255 characters, description up to 1500 characters
        and a price between 0 and 100000.
    </div>
    <div class="row">
        <form class="col-md-6" method="POST" th:action="@{/books}">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" class="form-control" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" class="form-control" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" maxlength="1500" rows="4"
                          required></textarea>
            </div>
            <div class="form-group">
                <label for="tags">Tags</label>
                <select multiple="multiple" name="tags" id="tags" class="form-control">
                    <option th:each="tag: ${tags}" th:value="${tag.id}" th:text="${tag.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" class="form-control" min="0" max="100000" step="0.01"
                       required>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
</body>
</html>
