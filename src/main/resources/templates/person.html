<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Profile</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Profile</h1>
    <div class="alert alert-danger" th:if="${param.duplicate}">This username is already taken.</div>
    <div class="row">
        <form method="POST" th:action="@{/update-person}" class="col-md-6">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" class="form-control" id="username" th:value="${username}"
                       maxlength="50" required>
            </div>
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" name="firstName" class="form-control" id="firstName"
                       th:value="${person.firstName}" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" name="lastName" class="form-control" id="lastName" th:value="${person.lastName}"
                       maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" class="form-control" id="email" th:value="${person.email}"
                       maxlength="255" required>
            </div>
            <input type="hidden" name="id" id="id" th:value="${person.id}">
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>

    <div class="mt-3">
        <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal">Delete User</button>
    </div>

    <div class="modal" tabindex="-1" role="dialog" id="deleteModal">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete User</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this user? This cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="deleteUser">Delete</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/person.js}" defer></script>
</th:block>
</body>
</html>
