<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Buy book</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Buy book</h1>
    <div class="row" th:unless="${bought}">
        <form id="buyBookForm" class="col-md-6" method="POST" th:action="@{/buy-book/{id}(id=${id})}">
            <div class="form-group">
                <label for="card">Card number</label>
                <input type="text" id="card" name="card" class="form-control" inputmode="numeric"
                       autocomplete="cc-number" maxlength="16" required>
                <span id="cardError" class="text-danger small field-error">Card number must be 16 digits.</span>
            </div>
            <div class="form-group">
                <label for="address">Delivery address</label>
                <input type="text" id="address" name="address" class="form-control" maxlength="255" required>
            </div>
            <div class="form-group">
                <label for="voucher">Voucher</label>
                <input type="text" id="voucher" name="voucher" class="form-control" maxlength="100">
            </div>
            <div class="text-danger mb-2" th:if="${addressError}">Address has to be at least 10 characters!</div>
            <button type="submit" class="btn btn-success">Pay</button>
        </form>
    </div>
    <div class="alert alert-success" th:if="${voucherUsed}">Voucher used!</div>
    <div class="alert alert-success" th:if="${bought}">Congratulations! Book successfully bought!</div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/buy-book.js}" defer></script>
</th:block>
</body>
</html>
